name: CI/CD

# CI on every push and pull request: Python tests, frontend build, Docker image build and
# smoke test. CD on pushes to main and v* tags: the tested image is published to GHCR.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRISM_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Install Chromium for PDF reports
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    name: Docker image
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prism:ci
          build-args: PRISM_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker run -d --name prism -p 8000:8000 prism:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health -o health.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json, os
          h = json.load(open("health.json"))
          print(json.dumps({k: h[k] for k in ("status", "device", "registry_size", "prism_commit", "vendor_commits")}, indent=2))
          assert h["status"] == "ok", h["status"]
          assert h["registry_size"] > 0, "registry not loaded"
          assert h["prism_commit"] == os.environ["EXPECTED_COMMIT"], h["prism_commit"]
          for repo in ("fast-alpr", "parseq", "vehicle-reidentification"):
              assert h["vendor_commits"][repo] != "not present", repo
          PY
          curl -fsS http://127.0.0.1:8000/ -o index.html
          grep -q "<title>PRISM" index.html
          curl -fsS -o /dev/null http://127.0.0.1:8000/app
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/config
          curl -fsS -o /dev/null http://127.0.0.1:8000/reports/index.html

      - name: Tests inside the image
        run: docker exec prism python -m pytest -q

      - name: Container logs
        if: always()
        run: docker logs prism || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PRISM_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
